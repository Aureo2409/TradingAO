<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients matching the high-res TradingAO logo -->
    <linearGradient id="grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#4364F7" />
    </linearGradient>
    <linearGradient id="grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <linearGradient id="grad-stem-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <linearGradient id="grad-stem-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
    <linearGradient id="grad-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072ff" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#7bfb54" />
    </linearGradient>
    
    <!-- Subtle glow filter to make it look premium on dark/light tabs -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00d4ff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- LEFT WING & PART OF STEM -->
    <path d="M 120 70 L 300 70 L 270 160 L 202 160 L 202 245 L 122 325 Z" fill="url(#grad-left)" />

    <!-- RIGHT WING & RIGHT STEM -->
    <path d="M 325 70 H 405 C 405 70 415 70 415 80 V 160 H 312 L 312 360 L 256 430 L 256 220 Z" fill="url(#grad-stem-right)" />
    
    <!-- STEM LEFT FACET (shield crystal style) -->
    <path d="M 256 220 L 256 430 L 198 375 L 198 278 Z" fill="url(#grad-stem-left)" opacity="0.9" />

    <!-- THE GLOWING UP-RIGHT ARROW -->
    <!-- Dark contour backdrop to separate arrow from T -->
    <path d="M 110 370 L 370 110" stroke="#06080f" stroke-width="26" stroke-linecap="butt" />
    <!-- Glowing core -->
    <path d="M 110 370 L 370 110" stroke="url(#grad-arrow)" stroke-width="16" stroke-linecap="butt" />
    
    <!-- Arrow Head -->
    <path d="M 330 110 L 400 80 L 370 150 Z" fill="url(#grad-arrow)" stroke="#06080f" stroke-width="6" stroke-linejoin="round" />
  </g>
</svg>
